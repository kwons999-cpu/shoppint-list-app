<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  body { font-family: system-ui, "Malgun Gothic", sans-serif; background: #f3f4f6; margin: 0; padding: 24px 16px; }
  .app { max-width: 440px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  h1 { margin: 0 0 16px; font-size: 22px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
  button { cursor: pointer; border: 0; border-radius: 8px; }
  .add { padding: 10px 16px; background: #2563eb; color: #fff; font-size: 16px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid #eee; }
  li input { width: 18px; height: 18px; }
  li span { flex: 1; word-break: break-all; }
  li.done span { text-decoration: line-through; color: #9ca3af; }
  .del { background: none; color: #dc2626; font-size: 18px; }
  .info { margin-top: 12px; color: #6b7280; font-size: 14px; display: flex; justify-content: space-between; }
  .clear { background: none; color: #6b7280; text-decoration: underline; font-size: 14px; }
  .empty { color: #9ca3af; text-align: center; padding: 20px 0; }
</style>
</head>
<body>
<div class="app">
  <h1>🛒 쇼핑 리스트</h1>
  <form id="form">
    <input type="text" id="input" placeholder="사야 할 것을 입력하세요" autocomplete="off" autofocus>
    <button class="add" type="submit">추가</button>
  </form>
  <ul id="list"></ul>
  <div class="info">
    <span id="count"></span>
    <button class="clear" id="clear">체크한 항목 삭제</button>
  </div>
</div>
<script>
  let items = [];
  try { items = JSON.parse(localStorage.getItem("shopping") || "[]"); } catch (e) {}

  const list = document.getElementById("list");
  const input = document.getElementById("input");

  function save() {
    try { localStorage.setItem("shopping", JSON.stringify(items)); } catch (e) {}
  }

  function render() {
    list.innerHTML = "";
    if (!items.length) {
      list.innerHTML = '<li class="empty" style="justify-content:center">목록이 비어 있습니다</li>';
    }
    items.forEach(item => {
      const li = document.createElement("li");
      if (item.done) li.className = "done";

      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = item.done;
      cb.onchange = () => { item.done = cb.checked; save(); render(); };

      const span = document.createElement("span");
      span.textContent = item.text;

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "✕";
      del.title = "삭제";
      del.onclick = () => { items = items.filter(i => i !== item); save(); render(); };

      li.append(cb, span, del);
      list.appendChild(li);
    });
    const done = items.filter(i => i.done).length;
    document.getElementById("count").textContent = `${done} / ${items.length} 완료`;
  }

  document.getElementById("form").onsubmit = e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    items.push({ text, done: false });
    input.value = "";
    save(); render();
  };

  document.getElementById("clear").onclick = () => {
    items = items.filter(i => !i.done);
    save(); render();
  };

  render();
</script>
</body>
</html>
